<!doctype html>
<html lang="th" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multimedia Studio - Web Application</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&family=Prompt:wght@300;400;500;600;700&family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <!-- Anti-CORS / Standalone Protocol Interceptor & Auto-Launcher -->
    <script>
      (function() {
        if (window.location.protocol === 'file:') {
          // If in root index.html via file://, redirect directly to compiled dist/index.html
          var pathname = window.location.pathname || '';
          if (!pathname.includes('/dist/')) {
            var targetDistUrl = window.location.href.replace(/index\.html$/, 'dist/index.html');
            if (targetDistUrl === window.location.href) {
              targetDistUrl = window.location.href + 'dist/index.html';
            }
            window.location.replace(targetDistUrl);
          }
        }
      })();
    </script>
  </head>
  <body class="h-full bg-slate-50 text-slate-800 antialiased selection:bg-blue-500 selection:text-white">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
